<div class="container">
  <h1>Verify Organization Hierarchy</h1>
  
  <div class="margin-top center">
    <input 
      type="file" 
      accept=".csv"
      (change)="onFileInput($event)"
      #fileInput
    >
  </div>

  <div *ngIf="errors.length > 0" class="margin-top">
    <h2>Validation Errors</h2>
    <ul>
      <li *ngFor="let error of errors">
        Row {{ error.row }} ({{ error.userData.email }}): {{ error.message }}
      </li>
    </ul>
